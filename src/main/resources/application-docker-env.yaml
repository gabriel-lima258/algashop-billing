spring:
  datasource:
    url: jdbc:postgresql://algashop-postgres:5432/billing
  jpa:
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/testdata
    # 5432, nao 5433: 5433 e a porta PUBLICADA no host. Dentro da rede do compose
    # quem responde e a porta do container.
    url: jdbc:postgresql://algashop-postgres:5432/billing

algashop:
  integrations:
    payment:
      fastpay:
        hostname: http://fastpay:9995
        # Endereco que o Fastpay usa para NOS chamar de volta. O herdado de
        # development-env e host.docker.internal:8082, que sai da rede do compose
        # para reentrar pela porta publicada - funciona por acidente no Docker
        # Desktop e nao existe no Linux. Dentro da rede, quem responde e o container.
        webhook-url: http://algashop-billing:8082/api/v1/webhooks/fastpay