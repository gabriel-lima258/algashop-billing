server.port: 8082

# config.import traz os secrets e parameters da aws (LocalStack) para este arquivo env.
# O seed é feito pelo etc/aws/init.sh (parameters.csv / secrets.csv).
# prefix facilita o uso: ${billing.params.datasource.url}, ${billing.secrets.datasource.username}

spring:
  config:
    import:
      - aws-secretsmanager:/secret/algashop/billing/database?prefix=billing.secrets.datasource.
      - aws-secretsmanager:/secret/algashop/billing/fastpay?prefix=billing.secrets.fastpay.
      - aws-parameterstore:/config/algashop/billing?prefix=billing.params
      - aws-parameterstore:/config/algashop/shared?prefix=shared.params
  cloud:
    aws:
      region:
        static: us-east-1
      endpoint: http://algashop-localstack:4566
      credentials:
        access-key: LSIAQAAAAAAVNCBMPNSG
        secret-key: test
  datasource:
    url: ${billing.params.datasource.url}
    username: ${billing.secrets.datasource.username}
    password: ${billing.secrets.datasource.password}
  jpa:
    show-sql: ${billing.params.jpa.show-sql}
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/testdata
    user: postgres
    password: postgres
    url: jdbc:postgresql://localhost:5433/billing
  security: # apontamos o resource para authorization server para ter validação e busca de chave públicas
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${shared.params.auth-server-url} # url de authorization server
  kafka:
    bootstrap-servers: algashop-kafka-1:9092,algashop-kafka-2:9093,algashop-kafka-3:9094
    properties:
      spring.json.type.mapping: # deserialização do type id do produtor
    admin:
      fail-fast: true
      auto-create: true
      modify-topic-configs: false
    producer: # produtor para topico de dead letter topic
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer # chave String
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer # valor Json
      properties:
        enable.idempotence: true
        request.timeout.ms: 5000 # tempo de UMA ida ao broker esperando a resposta
        delivery.timeout.ms: 30000 # teto da operação inteira: envio + retries + backoff + confirmação
        max.block.ms: 5000 # tempo que o próprio send() pode bloquear antes de existir future
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.gtech.algashop.* # define os pacotes seguros ao kafka para evitar erros
        spring.json.key.default.type: java.lang.String
        spring.json.value.default.type: java.lang.String
        spring.json.value.type.method: com.algaworks.algashop.billing.infrastructure.kafka.KafkaConsumerTypeIdIdentifier.readType

logging:
  level:
    com.netflix.discovery.DiscoveryClient: OFF # desativa error eureka em dev
    com.netflix.discovery: OFF
    com.netflix.eureka: OFF

algashop:
  integrations:
    payment:
      provider: FASTPAY
      fastpay:
        hostname: ${billing.params.fastpay.hostname}
        private-token: ${billing.secrets.fastpay.private-token}
        webhook-url: ${billing.params.fastpay.webhook-url}
  messaging:
    kafka:
      order-event-topic-name: ordering.order.events
      invoice-event-topic-name: billing.invoice.events
      order-events-consumer-group: billing.order-events
      invoice-events-consumer-group: billing.invoice-events

eureka:
  client:
    serviceUrl:
      defaultZone: ${shared.params.service-registry-url}/eureka
    healthcheck:
      enabled: true # habilita o health em eureka para status de serviço dentro de eureka
  instance:
    instanceId: ${random.uuid} # cada instancia replicada ganha um id unico
    prefer-ip-address: true # configura rede alcançável via docker
