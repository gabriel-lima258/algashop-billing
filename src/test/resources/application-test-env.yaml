spring:
  application:
    name: billing
  datasource:
    url: jdbc:postgresql://localhost:5433/billing_test
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: 'true'
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: postgres
    password: postgres
    url: jdbc:postgresql://localhost:5433/billing_test
  kafka:
    properties:
      spring.json.type.mapping:
        Billing.InvoiceIssuedIntegrationEvent:com.algaworks.algashop.billing.application.invoice.event.InvoiceIssuedIntegrationEvent,
        Billing.InvoiceCanceledIntegrationEvent:com.algaworks.algashop.billing.application.invoice.event.InvoiceCanceledIntegrationEvent,
        Billing.InvoicePaidIntegrationEvent:com.algaworks.algashop.billing.application.invoice.event.InvoicePaidIntegrationEvent,
        Billing.IssueInvoiceIntegrationCommand:com.algaworks.algashop.billing.application.invoice.command.IssueInvoiceIntegrationCommand
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
        linger.ms: 0
        request.timeout.ms: 4000
        delivery.timeout.ms: 5000
        max.block.ms: 5000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      group-id: billing
      properties:
        max.poll.interval.ms: 300000 # 5 minutos
        max.poll.records: 500
        heartbeat.interval.ms: 3000 # 3 segundos
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.algaworks.algashop.*
        spring.json.key.default.type: java.lang.String
        spring.json.value.default.type: java.lang.String
        spring.json.value.type.method: com.algaworks.algashop.billing.infrastructure.kafka.KafkaConsumerTypeIdIdentifier.readType
    # o listener do InvoiceIssued, de pe nos ITs, entraria no grupo billing.invoice-events
    # do cluster de desenvolvimento e cobraria faturas que nao existem no banco de teste
    listener:
      auto-startup: false

algashop:
  integrations:
    payment:
      provider: FASTPAY
      fastpay:
        hostname: http://localhost:8788
        private-token: SSEewtC6Ps5yJLdB6SJmh1bqJXgRbCdf8ocDj2hU
        public-token: tDBmh0ZiDrmaZ8BVQD7i9UYdcj9KtZUk
        webhook-url: http://host.docker.internal:8082/api/v1/webhooks/fastpay
  messaging:
    kafka:
      invoice-event-topic-name: billing.invoice.events
      invoice-commands-topic-name: billing.invoice.commands
      invoice-events-consumer-group: billing.invoice-events
      invoice-commands-consumer-group: billing.invoice-commands
